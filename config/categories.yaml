# ---------------------------------------------------------------------------
# Trend Analyst — category taxonomy (spec §6.1).
#
# MGS sub-scores are PER-CATEGORY percentiles, so every candidate must land in exactly
# one category. The lists below are deliberately small and readable: they are matched
# against real signal text (HN titles, Reddit post titles), and the coverage of that
# match is measured and reported rather than assumed
# (`python -m scripts.category_coverage` prints it).
#
# Per category:
#   core              the BUYABLE nouns of the domain: a phrase must contain at least one
#                     to be filed under this category. This is what stops "Cat Jarman" (a
#                     person) and "children killing" (a headline) from being mined as pet and
#                     baby products, which the first mining run did before this list existed.
#   keywords          context words: they break ties between categories, they do not create one
#   price_band        typical retail price in USD — the Money sub-score's prior
#   feasibility_prior how shippable this domain is for a solo operator, 0-100
#
# Top-level feasibility_penalties are subtracted from the prior when a phrase mentions
# one: they are the reasons an otherwise good product idea is not a solo project.
#
# This is a PRIOR, not a verdict: from P4 the Tier-A sources (eBay sold-vs-listed,
# reviews, ad libraries) sharpen price and saturation with observed data. Until then the
# scoring code says so in its docstrings instead of pretending the numbers are measured.
# ---------------------------------------------------------------------------

version: 1

#: Words that make a product hard to ship alone, whatever the category.
feasibility_penalties:
  - patent
  - regulated
  - fda
  - medical device
  - prescription
  - hazmat
  - lithium battery
  - firearm
  - licensed
  - insurance
  - warranty claim

#: Noise that never becomes a candidate: navigation, weekly threads, meta posts.
stop_phrases:
  - weekly thread
  - daily thread
  - megathread
  - question thread
  - buy sell trade
  - self promotion
  - announcement
  - rss
  - subscribe
  - newsletter
  - podcast

#: PRODUCT-FORM nouns: the words that end a product phrase without naming the domain.
#:
#: "chisel storage", "monitor mount", "trowel holder" — the buyable thing is the *form* (a storage
#: unit, a mount, a holder) and the domain comes from the modifier. Without this list those phrases
#: are rejected by a taxonomy that only knows "chisel", "monitor" and "trowel" — which is how the
#: first live run lost its single best find ("chisel storage", found in a woodworking complaint).
#:
#: A phrase whose head (last content word) is one of these is filed under the category its
#: *modifiers* point at; if no modifier matches a category, it stays uncategorized rather than
#: being filed under a guess.
product_nouns:
  [storage, organizer, holder, stand, mount, rack, shelf, tray, bin, box, caddy, case, cover,
   sleeve, pouch, bag, pad, mat, liner, insert, divider, clip, hook, strap, tie, wrap, seal,
   kit, set, blade, guard, jig, gauge, bracket, adapter, dispenser, scraper, sharpener, filter,
   brush, cleaner, sprayer, spreader, clamp, vise, bit, drill bit, sandpaper, tape, ruler,
   light, lamp, fan, heater, cushion, pillow, cover plate, strap, belt, harness, leash]

#: Brands and licensed characters. A phrase naming one is NOT a product gap: the market is closed
#: to a solo operator, and recommending it is recommending a lawsuit. The Judge gate caught
#: "mickey mouse" (dropped as "a generic copyrighted character") but only after it had been scored,
#: ranked and judged — this list rejects it at the taxonomy, where it costs nothing.
#: Deliberately short and obvious: a long list would rot, and the Judge is the real backstop.
brand_blocklist:
  [mickey mouse, disney, marvel, nintendo, pokemon, lego, barbie, star wars, harry potter,
   iphone, ipad, airpods, macbook, apple watch, dyson, yeti, stanley cup, hydro flask,
   nike, adidas, goPro, keurig, nespresso, instant pot, dyson, weber, traeger,
   xbox, playstation, switch, kindle, roomba, tesla,
   # 3D-printing and workshop brands: the first P7 run mined "bambulabs filament" and "bana
   # filament" (a typo of Bambu Lab). A brand name in front of a generic noun is a review of that
   # brand's product, which is not a product gap for anyone who is not that brand.
   bambu, bambulabs, prusa, creality, ender, anycubic, elegoo, voron, markforged, formlabs,
   dewalt, makita, milwaukee, bosch, ryobi, festool, ridgid]

