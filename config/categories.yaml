# ---------------------------------------------------------------------------
# Trend Analyst — category taxonomy (spec §6.1).
#
# MGS sub-scores are PER-CATEGORY percentiles, so every candidate lands in exactly
# one category. Since extraction moved to the Extractor gate (which files products
# itself), this file no longer matches text — it only describes the scoring buckets:
# what each one is called, what things in it typically cost, and how shippable the
# domain is for a solo operator. The matching vocabulary (keywords, core nouns,
# product forms, brand blocklist, stop phrases) was deleted with the deterministic
# miner: a word list cannot keep up with language, and the model does this job now.
#
# Per category:
#   price_band        typical retail price in USD — the Money sub-score's prior
#   feasibility_prior how shippable this domain is for a solo operator, 0-100
#
# Top-level feasibility_penalties are subtracted from the prior when a phrase mentions
# one: they are the reasons an otherwise good product idea is not a solo project.
#
# This is a PRIOR, not a verdict: from P4 the Tier-A sources (eBay sold-vs-listed,
# reviews, ad libraries) sharpen price and saturation with observed data. Until then the
# scoring code says so in its docstrings instead of pretending the numbers are measured.
# ---------------------------------------------------------------------------

version: 1

#: Words that make a product hard to ship alone, whatever the category.
feasibility_penalties:
  - patent
  - regulated
  - fda
  - medical device
  - prescription
  - hazmat
  - lithium battery
  - firearm
  - licensed
  - insurance
  - warranty claim

categories:
  home_office:
    label: Home office and desk
    price_band: [25, 180]
    feasibility_prior: 82

  kitchen_dining:
    label: Kitchen and dining
    price_band: [15, 150]
    feasibility_prior: 74

  home_improvement:
    label: Home improvement and repair
    price_band: [20, 200]
    feasibility_prior: 78

  outdoor_garden:
    label: Outdoor, garden and camping
    price_band: [20, 250]
    feasibility_prior: 76

  pets:
    label: Pets
    price_band: [15, 140]
    feasibility_prior: 80

  fitness_recovery:
    label: Fitness and recovery
    price_band: [20, 220]
    feasibility_prior: 72

  electronics_accessories:
    label: Electronics and accessories
    price_band: [15, 200]
    feasibility_prior: 68

  tools_diy:
    label: Tools, making and DIY
    price_band: [25, 300]
    feasibility_prior: 77

  baby_kids:
    label: Baby and kids
    price_band: [15, 160]
    feasibility_prior: 70

  music_audio:
    label: Music and audio
    price_band: [25, 300]
    feasibility_prior: 71
