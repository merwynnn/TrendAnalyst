# ---------------------------------------------------------------------------
# Trend Analyst — category taxonomy (spec §6.1).
#
# MGS sub-scores are PER-CATEGORY percentiles, so every candidate must land in exactly
# one category. The lists below are deliberately small and readable: they are matched
# against real signal text (HN titles, Reddit post titles), and the coverage of that
# match is measured and reported rather than assumed
# (`python -m scripts.category_coverage` prints it).
#
# Per category:
#   core              the BUYABLE nouns of the domain: a phrase must contain at least one
#                     to be filed under this category. This is what stops "Cat Jarman" (a
#                     person) and "children killing" (a headline) from being mined as pet and
#                     baby products, which the first mining run did before this list existed.
#   keywords          context words: they break ties between categories, they do not create one
#   price_band        typical retail price in USD — the Money sub-score's prior
#   feasibility_prior how shippable this domain is for a solo operator, 0-100
#
# Top-level feasibility_penalties are subtracted from the prior when a phrase mentions
# one: they are the reasons an otherwise good product idea is not a solo project.
#
# This is a PRIOR, not a verdict: from P4 the Tier-A sources (eBay sold-vs-listed,
# reviews, ad libraries) sharpen price and saturation with observed data. Until then the
# scoring code says so in its docstrings instead of pretending the numbers are measured.
# ---------------------------------------------------------------------------

version: 1

#: Words that make a product hard to ship alone, whatever the category.
feasibility_penalties:
  - patent
  - regulated
  - fda
  - medical device
  - prescription
  - hazmat
  - lithium battery
  - firearm
  - licensed
  - insurance
  - warranty claim

#: Noise that never becomes a candidate: navigation, weekly threads, meta posts.
stop_phrases:
  - weekly thread
  - daily thread
  - megathread
  - question thread
  - buy sell trade
  - self promotion
  - announcement
  - rss
  - subscribe
  - newsletter
  - podcast

