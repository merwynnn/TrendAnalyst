# Trend Analyst — local credentials template.
#
# Copy this file to config/secrets.local.yaml and paste real values there:
#     cp config/secrets.example.yaml config/secrets.local.yaml
#
#   * config/secrets.local.yaml is UNTRACKED (.gitignore) and MUST never be committed.
#   * Real values NEVER go in this template, in .env.example, in tests, or in logs.
#   * Keys live here rather than in the environment (decision B4). Environment
#     variables remain available as an override layer for CI only.
#   * A blank key means "not wired up yet": the matching source stays
#     `enabled: false` in config/sources.yaml and the pipeline runs without it.

db:
  # Filled in automatically by scripts/provision_pg.sh (local WSL Postgres 18 + pgvector).
  url: "postgresql+psycopg://trend_analyst:CHANGE_ME@localhost:5432/trend_analyst"

llm:
  # Gate provider chain (spec §6.3): Gemini -> Groq -> Cerebras -> local Ollama.
  gemini_api_key: ""
  groq_api_key: ""
  cerebras_api_key: ""
  ollama_base_url: "http://localhost:11434"

tier_a:
  # Tier-A enrichment sources (spec Appendix A). Every one stays disabled until its
  # credential exists here.
  ebay_client_id: ""
  ebay_client_secret: ""
  github_token: ""
  bestbuy_api_key: ""
  serper_api_key: ""
  producthunt_token: ""
  walmart_client_id: ""
  walmart_client_secret: ""
  searchapi_key: ""
