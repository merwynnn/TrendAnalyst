# ---------------------------------------------------------------------------
# Alembic configuration. The URL is deliberately NOT here: it is resolved at
# runtime from the layered settings (config/settings.py), which means from
# config/secrets.local.yaml. See migrations/env.py.
#
#   uv run alembic upgrade head      # apply
#   uv run alembic check             # zero drift between models and migrations
#   uv run alembic downgrade base    # undo everything
#   uv run alembic revision --autogenerate -m "..."   # new migration
# ---------------------------------------------------------------------------
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
#: Left empty on purpose — see the note above, and `_database_url()` in migrations/env.py.
sqlalchemy.url =

# Post-write hooks. `type = exec` rather than `console_scripts`: the entry-point form
# needs pkg_resources, which this project deliberately does not depend on.
[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = uv
ruff_format.options = run ruff format REVISION_SCRIPT_FILENAME

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
